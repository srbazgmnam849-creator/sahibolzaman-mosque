name: Auto Refresh (هر ۵ ساعت)

on:
  schedule:
    - cron: '0 */5 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: keepalive-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update refresh timestamp
        run: |
          TS=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          echo "{\"last_refresh_utc\": \"$TS\"}" > last-refresh.json
          git config user.name "auto-refresh-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add last-refresh.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: auto-refresh $TS"
            git push
          fi

      - name: Trigger Pages rebuild
        run: |
          CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages/build")
          echo "Pages rebuild HTTP status: $CODE"
